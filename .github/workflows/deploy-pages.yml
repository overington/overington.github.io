name: Build and deploy Zola site

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Check and build the site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ghcr.io/getzola/zola:v0.23.6 check --skip-external-links
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ghcr.io/getzola/zola:v0.23.6 build --base-url "$PAGES_BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
