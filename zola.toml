# The URL the site will be built for
base_url = "https://samueloverington.com"
title = "Samuel Overington"
description = ""

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "picolo"

taxonomies = [
    { name = "categories", render = true, feed = false },
    { name = "tags", render = true, feed = false },
]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Navigation
show_nav = true
nav_items = [
    { path = "/", name = "/" },
    { path = "/projects", name = "Projects" },
    { path = "/blog", name = "Blog" },
    { path = "/about", name = "About" }
]
# Content widths. The default applies to pages, posts, sections, and taxonomies.
container_width = "pico"
# Optional: constrain page/section headings and hero header content independently.
# Defaults to the resolved container_width when unset.
# header_content_width = "xl"
